name: Build upload CSV
on:
  workflow_dispatch: {}
  push:
    paths: ["data/listings.json", "banners/**", "build_csv.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_csv.py
      - name: Save CSVs into the repo
        run: |
          git config user.name "bst-autopilot"
          git config user.email "bst-autopilot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Rebuild upload CSVs"
          git push
